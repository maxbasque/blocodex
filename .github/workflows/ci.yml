name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
  DATABASE_URL_UNPOOLED: postgres://placeholder:placeholder@localhost:5432/placeholder

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Migration drift check
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "db/schema.ts and drizzle/ migrations are out of sync."
            echo "Run 'npm run db:generate' locally and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
